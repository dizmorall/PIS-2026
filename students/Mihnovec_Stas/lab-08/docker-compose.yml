version: '3.8'

services:
  # Шина событий (Event Bus)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # Порт для сервисов
      - "15672:15672" # UI для управления (логин/пароль: guest/guest)

  # Единая точка входа
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - complaint-service
      - moderation-service

  # Микросервис Жалоб
  complaint-service:
    image: python:3.10-slim
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    # (Здесь в реальности была бы команда запуска FastAPI)
    command: tail -f /dev/null

  # Микросервис Модерации (Ревью)
  moderation-service:
    image: python:3.10-slim
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    command: tail -f /dev/null

  # Микросервис Уведомлений
  notification-service:
    image: python:3.10-slim
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    command: tail -f /dev/null